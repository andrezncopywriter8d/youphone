services:
  postgres:
    image: postgres:16-alpine
    container_name: cellshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cellshop
      POSTGRES_PASSWORD: cellshop
      POSTGRES_DB: cellshop
    ports:
      - "5432:5432"
    volumes:
      - cellshop_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cellshop_postgres:
